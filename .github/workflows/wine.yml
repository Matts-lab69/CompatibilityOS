# SPDX-License-Identifier: MIT
name: Wine CI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wine.yml', '.github/workflows/installer.yml', 'ci/**', 'scripts/**', 'patches/**', 'tests/**', 'runner/**', 'packaging/**', 'recipes/**', 'installer/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install build tools on the hosted runner
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 \
            bison flex pkg-config libx11-dev libxext-dev libxrandr-dev libxrender-dev libxi-dev \
            libxfixes-dev libxcursor-dev libxinerama-dev libxcomposite-dev libfreetype-dev \
            libvulkan-dev libpulse-dev libasound2-dev libudev-dev libusb-1.0-0-dev libfontconfig-dev libcups2-dev xvfb xauth
      - name: Build bundle
        run: bash 'ci/build-wine.sh' "$RUNNER_TEMP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wine-ci-staging
          path: |
            ${{ runner.temp }}/out/compatibilityos.tar.gz
            ${{ runner.temp }}/out/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wine-ci-staging
          path: ${{ runner.temp }}/out
      - name: Restore test package archives
        id: test-apt
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/wine-test-debs
          key: wine-test-apt-noble-${{ runner.arch }}-${{ hashFiles('.github/workflows/wine.yml') }}
          restore-keys: wine-test-apt-noble-${{ runner.arch }}-
      - name: Install test tools on the hosted runner
        id: test-tools
        timeout-minutes: 35
        shell: bash
        run: |
          cache="$RUNNER_TEMP/wine-test-debs"
          archives="$RUNNER_TEMP/wine-test-apt/archives"
          mkdir -p -- "$cache" "$archives"
          shopt -s nullglob
          packages=(gcc-mingw-w64-x86-64-posix gcc-mingw-w64-i686-posix wixl xvfb xauth xdg-user-dirs python3-fonttools mono-devel cups)
          options=(-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o "Dir::Cache::archives=$archives")
          sudo apt-get "${options[@]}" -o APT::Update::Error-Mode=any update
          for archive in "$cache/"*.deb; do
            [[ -f $archive && ! -L $archive ]] || continue
            package=$(dpkg-deb -f "$archive" Package) || continue
            version=$(dpkg-deb -f "$archive" Version) || continue
            architecture=$(dpkg-deb -f "$archive" Architecture) || continue
            [[ $package =~ ^[a-z0-9][a-z0-9+.-]+$ && $version =~ ^[0-9][a-zA-Z0-9.+:~-]*$ && $architecture =~ ^[a-z0-9-]+$ ]] || continue
            [[ ${archive##*/} == "${package}_${version//:/%3a}_${architecture}.deb" ]] || continue
            digest=$(sha256sum -- "$archive")
            digest=${digest%% *}
            # Match architecture and checksum in the same authenticated stanza.
            if apt-cache show "$package=$version" | awk -v arch="$architecture" -v sha="$digest" '
              BEGIN { RS=""; FS="\n" }
              { a=0; s=0; for (i=1; i<=NF; i++) { if ($i == "Architecture: " arch) a=1; if ($i == "SHA256: " sha) s=1 } if (a && s) found=1 }
              END { exit !found }
            '; then
              sudo install -m 644 -- "$archive" "$archives/"
            fi
          done
          sudo apt-get "${options[@]}" install -y --no-install-recommends --download-only "${packages[@]}"
          rm -f -- "$cache/"*.deb
          for archive in "$archives/"*.deb; do install -m 644 -- "$archive" "$cache/"; done
          sudo apt-get "${options[@]}" install -y --no-install-recommends "${packages[@]}"
          bytes=$(du -sb -- "$cache" | cut -f1)
          debs=("$cache/"*.deb)
          if (( ${#debs[@]} > 0 && bytes <= 512 * 1024 * 1024 )); then
            echo 'cacheable=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Save test package archives
        if: github.ref == 'refs/heads/main' && steps.test-tools.outputs.cacheable == 'true' && steps.test-apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/wine-test-debs
          key: ${{ steps.test-apt.outputs.cache-primary-key }}
      - name: Prepare the CUPS socket backend on the hosted runner
        run: |
          backend='/usr/lib/cups/backend/socket'
          available='/usr/lib/cups/backend-available/socket'
          if ! sudo test -x "$backend"; then
            sudo test -x "$available" || { echo "CUPS backend not executable: $available" >&2; exit 1; }
            sudo ln -s -- "$available" "$backend"
          fi
          sudo systemctl start cups.socket cups.service
          test -S '/run/cups/cups.sock' || { echo 'CUPS Unix socket not created' >&2; exit 1; }
          lpstat -h '/run/cups/cups.sock' -r
          sudo lpinfo -h '/run/cups/cups.sock' -v | grep -Fx 'network socket' || { echo 'CUPS did not advertise the socket backend' >&2; exit 1; }
      - name: Test Windows dispatch and WoW64 under Xvfb
        run: xvfb-run -a bash 'tests/wine-smoke.sh' "$RUNNER_TEMP"
  attest:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wine-ci-staging
          path: ${{ runner.temp }}/out
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            ${{ runner.temp }}/out/compatibilityos.tar.gz
            ${{ runner.temp }}/out/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compatibilityos-linux-x86_64
          path: |
            ${{ runner.temp }}/out/compatibilityos.tar.gz
            ${{ runner.temp }}/out/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
