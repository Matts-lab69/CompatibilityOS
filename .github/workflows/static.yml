# SPDX-License-Identifier: MIT
name: Static checks
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell scripts and patch series
        shell: bash
        run: |
          git ls-files -z '*.sh' 'runner/cpos-run' 'scripts/migrate-recipes' | xargs -0 -r shellcheck -x
          bash 'tests/check-series.sh'
          bash 'tests/check-recipes.sh'
          bash 'tests/desktop-errors.sh'
          bash 'installer/install.sh' --dry-run install 1
      - name: Validate desktop and MIME templates
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends desktop-file-utils shared-mime-info libxml2-utils
          desktop-file-validate 'packaging/mime/compatibilityos.desktop'
          xmllint --nonet --noout 'packaging/mime/compatibilityos.xml'
          database=$(mktemp -d)
          mkdir -p -- "$database/packages"
          cp -- 'packaging/mime/compatibilityos.xml' "$database/packages/"
          update-mime-database "$database"
          grep -Fx '50:application/x-ms-dos-executable:*.exe' "$database/globs2"
          grep -Fx '50:application/x-msi:*.msi' "$database/globs2"
