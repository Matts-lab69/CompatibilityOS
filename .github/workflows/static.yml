# SPDX-License-Identifier: MIT
name: Static checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check shell scripts and patch series
        shell: bash
        run: |
          git ls-files -z '*.sh' 'runner/cpos-run' 'scripts/migrate-recipes' | xargs -0 -r shellcheck -x
          bash 'tests/check-series.sh'
          bash 'tests/check-recipes.sh'
