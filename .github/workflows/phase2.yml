# SPDX-License-Identifier: MIT
name: Experimental Phase 2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/phase2.yml', 'cpos-peload/**', 'cpos-kernel/**']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  peload:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 30
    steps:
      - name: Install fixture build tools in CI
        timeout-minutes: 24
        run: |
          apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 update
          apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 install -y --no-install-recommends \
            ca-certificates git make clang libclang-rt-dev gcc-mingw-w64-x86-64-posix python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: pe-checkout
        with:
          persist-credentials: false
      - name: Build and run repository-owned MinGW execution fixtures
        run: make -C 'cpos-peload' CC=clang check-exec
      - name: Unit test and fuzz the non-executable PE staging loader
        if: ${{ !cancelled() && steps.pe-checkout.outcome == 'success' }}
        run: make -C 'cpos-peload' CC=clang fuzz
      - name: Check synchronous thread messaging
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -pthread \
            'cpos-peload/message.c' 'cpos-peload/test_message.c' -o "$RUNNER_TEMP/test-message"
          timeout 15 "$RUNNER_TEMP/test-message"
  kernel:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 45
    steps:
      - name: Install container build dependencies
        timeout-minutes: 24
        run: |
          apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 update
          apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 install -y --no-install-recommends \
            gcc make libc6-dev ca-certificates git linux-headers-generic linux-image-generic \
            qemu-system-x86 busybox-static cpio
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile the experimental module without loading it
        shell: bash
        run: |
          headers=$(find '/usr/src' -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)
          test -n "$headers"
          make -C "$headers" M="$PWD/cpos-kernel" modules
          test -s 'cpos-kernel/cpos.ko'
          printf 'CPOS_GUEST_KERNEL=/boot/vmlinuz-%s\n' "${headers##*/linux-headers-}" >> "$GITHUB_ENV"
      - name: Check ABI v1, v2 and v3 layouts without opening the device
        run: cc -std=c11 -Wall -Wextra -Werror -fsyntax-only 'cpos-kernel/abi_layout.c'
      - name: Exercise functional ioctls inside a disposable guest
        timeout-minutes: 8
        shell: bash
        run: |
          cc -std=c11 -Wall -Wextra -Werror -static 'cpos-kernel/tests/ioctl_functional.c' -o "$RUNNER_TEMP/ioctl-functional"
          cc -std=c11 -Wall -Wextra -Werror -static -pthread 'cpos-peload/message.c' 'cpos-peload/test_message.c' -o "$RUNNER_TEMP/message-test"
          bash 'cpos-kernel/tests/run-qemu.sh' "$CPOS_GUEST_KERNEL" 'cpos-kernel/cpos.ko' "$RUNNER_TEMP/ioctl-functional" '/bin/busybox' "$RUNNER_TEMP/message-test"
