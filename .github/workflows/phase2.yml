# SPDX-License-Identifier: MIT
name: Experimental Phase 2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/phase2.yml', 'cpos-peload/**', 'cpos-kernel/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  peload:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 10
    steps:
      - name: Install fixture build tools in CI
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential clang libclang-rt-dev gcc-mingw-w64-x86-64
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile, unit test and fuzz the non-executable PE staging loader
        run: |
          make -C 'cpos-peload' CC=clang check
          make -C 'cpos-peload' CC=clang check-exec
          make -C 'cpos-peload' CC=clang fuzz
      - name: Check synchronous thread messaging
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -pthread \
            'cpos-peload/message.c' 'cpos-peload/test_message.c' -o "$RUNNER_TEMP/test-message"
          timeout 15 "$RUNNER_TEMP/test-message"
  kernel:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - name: Install container build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates git linux-headers-generic
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile the experimental module without loading it
        shell: bash
        run: |
          headers=$(find '/usr/src' -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)
          test -n "$headers"
          make -C "$headers" M="$PWD/cpos-kernel" modules
          test -s 'cpos-kernel/cpos.ko'
      - name: Check ABI v1 from userspace without opening the device
        run: cc -std=c11 -Wall -Wextra -Werror -fsyntax-only 'cpos-kernel/abi_layout.c'
