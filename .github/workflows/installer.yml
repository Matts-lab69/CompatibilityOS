# SPDX-License-Identifier: MIT
name: Installer verification
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Wine CI run from main
        required: true
        type: string
  workflow_run:
    workflows: [Wine CI]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  attestations: read
  contents: read
jobs:
  installer:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify installation lifecycle under disposable XDG paths
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends desktop-file-utils shared-mime-info xdg-utils
          bash 'tests/installer-smoke.sh' "$RUNNER_TEMP" "$RUN_ID"
