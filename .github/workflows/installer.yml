# SPDX-License-Identifier: MIT
name: Installer verification
on:
  workflow_run:
    workflows: [Wine CI]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  attestations: read
  contents: read
jobs:
  installer:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify installation lifecycle under disposable XDG paths
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils shared-mime-info xdg-utils
          bash 'tests/installer-smoke.sh' "$RUNNER_TEMP" "$RUN_ID"
